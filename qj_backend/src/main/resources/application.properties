# 腾讯云COS配置
tencent.cos.secretId=${TENCENT_COS_SECRET_ID:}
tencent.cos.secretKey=${TENCENT_COS_SECRET_KEY:}
tencent.cos.region=ap-shanghai
tencent.cos.bucketName=qj-formal-1g06n5f37194ef95
tencent.cos.baseUrl=https://qj-formal-1g06n5f37194ef95.cos.ap-shanghai.myqcloud.com

# Playwright Java 已集成到 TestReportService 中
# 无需额外配置，使用默认参数

# AI 试穿 - Ark (Doubao-Seedream-4.5) 配置
# ark.api-key 已迁移到数据库 qj_app_config.ark_api_key（由 AppConfigService 启动时加载）
ark.base-url=https://ark.cn-beijing.volces.com/api/v3
ark.model=doubao-seedream-4-5-251128
ark.timeout-ms=120000

# AI 试穿功能配置
ai.tryon.total-free-limit=2
ai.tryon.upload-free-limit=2
ai.tryon.generate-free-limit=2
ai.tryon.daily-upload-cap=5
# 单价 ai.tryon.unit-price 走 profile：dev=1 分，prod=100 分
ai.tryon.model-name=doubao-seedream-4-5

# Gemini wardrobe style recognition. Keep the real key outside the repository.
gemini.api-key=${GEMINI_API_KEY:}
wardrobe.prompt.auth-required=${WARDROBE_PROMPT_AUTH_REQUIRED:true}
wardrobe.prompt.auth-secret=${WARDROBE_PROMPT_AUTH_SECRET:}
wardrobe.prompt.auto.enabled=${WARDROBE_PROMPT_AUTO_ENABLED:true}
wardrobe.prompt.auto.recovery-delay-ms=${WARDROBE_PROMPT_AUTO_RECOVERY_DELAY_MS:60000}
wardrobe.prompt.auto.maximum-failure-rate=${WARDROBE_PROMPT_AUTO_MAX_FAILURE_RATE:0.20}
wardrobe.prompt.auto.maximum-training-samples=${WARDROBE_PROMPT_AUTO_MAX_TRAINING_SAMPLES:50}
wardrobe.prompt.monitor.enabled=${WARDROBE_PROMPT_MONITOR_ENABLED:true}
wardrobe.prompt.monitor.recovery-delay-ms=${WARDROBE_PROMPT_MONITOR_RECOVERY_DELAY_MS:60000}
wardrobe.prompt.monitor.maximum-failure-rate=${WARDROBE_PROMPT_MONITOR_MAX_FAILURE_RATE:0.20}
wardrobe.prompt.monitor.minimum-style-mae-regression=${WARDROBE_PROMPT_MONITOR_MIN_STYLE_MAE_REGRESSION:5.0}
wardrobe.prompt.monitor.shadow-retries=${WARDROBE_PROMPT_MONITOR_SHADOW_RETRIES:2}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
gemini.timeout-ms=${GEMINI_TIMEOUT_MS:18000}
gemini.fallback-models=${GEMINI_FALLBACK_MODELS:gemini-flash-latest,gemini-3.1-flash-lite,gemini-2.0-flash}
gemini.max-attempts-per-model=${GEMINI_MAX_ATTEMPTS_PER_MODEL:1}
gemini.retry-backoff-ms=${GEMINI_RETRY_BACKOFF_MS:500}

# 微信支付凭据 + Ark API Key 已迁移到数据库 qj_app_config 表，
# 由 AppConfigService 启动时加载（重启生效）。
