# 默认 dev，生产用 SPRING_PROFILES_ACTIVE=prod 覆盖
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.application.name=qj_backend
server.address=0.0.0.0
server.port=7077
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB

# 日志配置（logging.level.com.qj 按 profile 覆盖：dev=DEBUG, prod=INFO）
logging.level.root=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/qj_backend.log
logging.file.max-size=10MB
logging.file.max-history=30

# 微信小程序配置
wx.miniapp.appid=wx05c823efd45071c2
wx.miniapp.secret=${WX_MINIAPP_SECRET:}
wx.miniapp.env=qj-formal-1g06n5f37194ef95

# 二维码跳转页面配置
# 小程序页面路径（用于正式版本）- 改回旧项目的登录页面路径
wx.qrcode.page=pages/login/login
# 本地开发时的页面路径（可选，用于本地测试）
wx.qrcode.page.local=file:///D:/qjnew/qjapiv2/index.html
# 在线版本页面路径（可选，用于部署后的网页版本）
wx.qrcode.page.online=https://your-domain.com/index.html
# 是否使用本地页面（true: 使用本地页面, false: 使用小程序页面）
wx.qrcode.use-local=false

# 二维码本地存储配置
# 二维码图片存储目录（相对路径，会在项目根目录下创建）
wx.qrcode.storage.path=qrcode_images
# server.base-url 按 profile 覆盖（dev=本地 127.0.0.1:7077, prod=公网 qjapiv2.foxcodes.cn）

# 代理动态推广码有效期（天）；0 或负数=永久。甲方要求 3 天
wx.promo.code.expire-days=3

